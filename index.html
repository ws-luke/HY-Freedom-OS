<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/freedom-os-icon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Freedom OS">
    <meta name="application-name" content="Freedom OS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="HY Freedom OS — 交易規劃、MT5 紀錄、復盤、風控與交易分析系統。">
    <title>HY Freedom OS</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('hy-freedom-os:theme') === 'light'
            ? 'light'
            : 'dark'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
