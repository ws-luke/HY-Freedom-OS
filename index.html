<!DOCTYPE html>
<html lang="zh-Hant" data-theme="dark">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/freedom-os-icon.svg">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Freedom OS">
    <meta name="application-name" content="Freedom OS">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="description" content="HY Freedom OS — 交易規劃、MT5 紀錄、復盤、風控與交易分析系統。">
    <title>HY Freedom OS</title>
    <style>
      #hy-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(139, 92, 246, 0.14), transparent 34%),
          radial-gradient(circle at 62% 58%, rgba(56, 189, 248, 0.08), transparent 30%),
          #09090b;
        color: #f8fafc;
        opacity: 1;
        visibility: visible;
        transition: opacity 420ms ease, visibility 420ms ease;
      }

      :root[data-theme='light'] #hy-boot-splash {
        background:
          radial-gradient(circle at 50% 42%, rgba(139, 92, 246, 0.12), transparent 34%),
          radial-gradient(circle at 62% 58%, rgba(56, 189, 248, 0.11), transparent 30%),
          #f5f7fb;
        color: #0f172a;
      }

      #hy-boot-splash.hy-boot-splash--leaving {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .hy-boot-splash__content {
        display: flex;
        width: min(82vw, 22rem);
        flex-direction: column;
        align-items: center;
        text-align: center;
      }

      .hy-boot-splash__mark {
        position: relative;
        display: grid;
        width: 5.5rem;
        height: 5.5rem;
        place-items: center;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 1.75rem;
        background: rgba(12, 13, 16, 0.88);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
        isolation: isolate;
      }

      :root[data-theme='light'] .hy-boot-splash__mark {
        border-color: rgba(100, 116, 139, 0.2);
        background: rgba(255, 255, 255, 0.92);
        box-shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
      }

      .hy-boot-splash__mark::before {
        position: absolute;
        inset: -0.55rem;
        z-index: -1;
        border: 1px solid rgba(139, 92, 246, 0.22);
        border-radius: 2.15rem;
        content: '';
        animation: hy-boot-pulse 1.8s ease-in-out infinite;
      }

      .hy-boot-splash__logo {
        width: 3.4rem;
        height: 3.4rem;
      }

      .hy-boot-splash__eyebrow {
        margin-top: 2rem;
        color: #a78bfa;
        font: 700 0.68rem/1.2 ui-sans-serif, system-ui, -apple-system, sans-serif;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }

      .hy-boot-splash__title {
        margin: 0.55rem 0 0;
        font: 750 clamp(1.6rem, 7vw, 2.2rem)/1.1 ui-sans-serif, system-ui, -apple-system, sans-serif;
        letter-spacing: -0.035em;
      }

      .hy-boot-splash__status {
        margin-top: 0.65rem;
        color: #94a3b8;
        font: 500 0.78rem/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
        letter-spacing: 0.06em;
      }

      :root[data-theme='light'] .hy-boot-splash__status {
        color: #64748b;
      }

      .hy-boot-splash__track {
        width: 7.5rem;
        height: 0.18rem;
        margin-top: 1.55rem;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.18);
      }

      .hy-boot-splash__bar {
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #38bdf8, #8b5cf6 56%, #fbbf24);
        animation: hy-boot-progress 1.15s ease-in-out infinite;
      }

      @keyframes hy-boot-progress {
        0% { transform: translateX(-115%); }
        100% { transform: translateX(260%); }
      }

      @keyframes hy-boot-pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.94); }
        50% { opacity: 0.9; transform: scale(1); }
      }

      @media (prefers-reduced-motion: reduce) {
        #hy-boot-splash { transition-duration: 120ms; }
        .hy-boot-splash__mark::before,
        .hy-boot-splash__bar { animation: none; }
        .hy-boot-splash__bar { width: 100%; opacity: 0.72; }
      }
    </style>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('hy-freedom-os:theme') === 'light'
            ? 'light'
            : 'dark'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div id="hy-boot-splash" role="status" aria-live="polite" aria-label="Freedom OS 啟動中">
      <div class="hy-boot-splash__content">
        <div class="hy-boot-splash__mark" aria-hidden="true">
          <svg class="hy-boot-splash__logo" viewBox="0 0 88 88" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="hy-boot-accent" x1="26" y1="20" x2="70" y2="70" gradientUnits="userSpaceOnUse">
                <stop stop-color="#38BDF8"/>
                <stop offset="0.55" stop-color="#8B5CF6"/>
                <stop offset="1" stop-color="#FBBF24"/>
              </linearGradient>
            </defs>
            <path d="M17 66V22h30v11H30v7h15v11H30v15H17Z" fill="currentColor"/>
            <path d="M60 27c13 0 22 9 22 20s-9 20-22 20-22-9-22-20 9-20 22-20Zm0 11c-6 0-10 4-10 9s4 9 10 9 10-4 10-9-4-9-10-9Z" fill="url(#hy-boot-accent)"/>
          </svg>
        </div>
        <div class="hy-boot-splash__eyebrow">HY Freedom OS</div>
        <h1 class="hy-boot-splash__title">自由交易系統</h1>
        <div class="hy-boot-splash__status">正在準備你的交易工作區</div>
        <div class="hy-boot-splash__track" aria-hidden="true">
          <div class="hy-boot-splash__bar"></div>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var splash = document.getElementById('hy-boot-splash')
        if (!splash) return
        splash.classList.add('hy-boot-splash--leaving')
        window.setTimeout(function () { splash.remove() }, 500)
      }, 10000)
    </script>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
